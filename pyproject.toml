[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfaa-defensive"
version = "0.3.0"
description = "MFAA: a defensive multi-asset allocation framework (13612 momentum + ensembled trend + canary overlay) with an honest anti-overfitting research harness"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Vincent Liu"}
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]
keywords = [
    "portfolio", "defensive", "momentum", "trend-following",
    "tactical-asset-allocation", "risk-parity", "deflated-sharpe",
    "backtest", "quant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mfaa-experiment = "mfaa.experiment:main"

[project.urls]
Homepage = "https://github.com/xzliuxz/MFAA-defensive-multi-asset-framework-"
Repository = "https://github.com/xzliuxz/MFAA-defensive-multi-asset-framework-"
Issues = "https://github.com/xzliuxz/MFAA-defensive-multi-asset-framework-/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
